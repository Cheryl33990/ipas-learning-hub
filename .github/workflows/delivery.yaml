name: 手動交付檢查（不部署）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 重新執行映像測試
        run: docker build --build-arg CODE_VERSION=${{ github.sha }} --target test -t ipas-hub:test .
      - name: 建立以 commit 識別的候選映像
        run: docker build --build-arg CODE_VERSION=${{ github.sha }} --target runtime -t ipas-hub:${{ github.sha }} .
      - run: docker run --rm --network none ipas-hub:${{ github.sha }} --help
      - name: 記錄交付識別，不推送 Registry
        run: docker image inspect ipas-hub:${{ github.sha }} --format '{{.Id}}' >> "$GITHUB_STEP_SUMMARY"
