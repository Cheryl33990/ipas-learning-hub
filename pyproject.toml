[project]
name = "ipas-hub"
version = "0.0.1"
description = "iPAS AI 應用規劃師備考輔助：題目找教材出處（探索階段）"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pypdf>=5.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipas_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
