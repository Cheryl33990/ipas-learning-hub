[project]
name = "ipas-hub"
version = "0.0.1"
description = "Local RAG with hybrid retrieval, per-sentence citation checks and links back to versioned PDF pages"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# torch 明列，才能套用下方 Linux 用 CPU 版的來源設定
embeddings = ["sentence-transformers>=3.0", "torch>=2.0"]
pg = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.14.0",
]

# 向量計算固定在 CPU（knowledge.py 以 device="cpu" 載入）；Linux（含 Docker 映像）改用 CPU 版 torch，
# 避免安裝約數 GB 的 CUDA 套件。Windows／macOS 仍用 PyPI 的 torch。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipas_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 只啟用預設的 lint 規則（pyflakes 與 pycodestyle 錯誤類）；格式由 ruff format 管理（CI 以 --check 檢查）
[tool.ruff]
target-version = "py311"
line-length = 120
