[project]
name = "ipas-hub"
version = "0.0.1"
description = "本機 RAG 知識助理：混合檢索、逐句引用檢查、可回查 PDF 原頁與版本"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pypdf>=5.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
pg = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipas_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 只啟用預設的 lint 規則（pyflakes 與 pycodestyle 錯誤類）；尚未採用 ruff format
[tool.ruff]
target-version = "py311"
line-length = 120
