services:
  app:
    build:
      context: .
      target: runtime
    image: ipas-hub:local
    environment:
      LLM_BASE_URL: http://vllm:8000/v1
      LLM_MODEL: ${LLM_SERVED_NAME:-qwen3-vl-8b-fp8}
      # 只在使用 --store pg 時用到；資料庫服務見下方 db
      PG_DSN: host=db port=5432 dbname=ipas user=ipas
      PGPASSWORD: ${PG_PASSWORD:-}
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/index:/app/data/index
      - ./data/runs:/app/data/runs
      - ./data/evaluation:/app/data/evaluation:ro
      - ./data/review:/app/data/review:ro
      - hf-cache:/models/huggingface
    command: ["--help"]
  # 本機生成模型。只在 --profile llm 啟動；模型從既有 volume 唯讀載入、離線執行，不自動下載。
  # 以 .env 的 LLM_MODEL_VOLUME 指定存放模型的 volume（例如電腦上已下載好的 Hugging Face 快取）。
  vllm:
    image: vllm/vllm-openai:v0.26.0@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
    profiles: [llm, serve]
    gpus: all
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # WSL2（Docker Desktop）預設關閉 pinned memory，此版 vLLM 需要它才能啟動
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
    volumes:
      - llm-models:/hf:ro
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - ${LLM_HF_MODEL:-Qwen/Qwen3-VL-8B-Instruct-FP8}
      - --revision=${LLM_HF_REVISION:-9cdc6310a8cb770ce18efaf4e9935334512aee45}
      - --served-model-name=${LLM_SERVED_NAME:-qwen3-vl-8b-fp8}
      # 16 GB 顯示卡、桌面程式共用顯存時的保守設定：只載入文字模型、限制上下文與並行數
      - --language-model-only
      - --max-model-len=6144
      - --kv-cache-dtype=fp8
      - --gpu-memory-utilization=${LLM_GPU_UTIL:-0.62}
      - --max-num-seqs=4
      - --enforce-eager
      # 讓以工具呼叫運作的平台功能（如 LibreChat 檔案檢索）可用；不影響一般 JSON 回答
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --host=0.0.0.0
      - --port=8000
  # RAG 端點（--profile serve）：多知識庫路由，連 db 與 vllm；不必在主機另開視窗執行 serve。
  # 容器內綁 0.0.0.0 讓 ui 與主機連得到，主機端只公開在 127.0.0.1。
  # 混合檢索要在容器內算問題向量，所以映像含 embeddings（Linux 用 CPU 版 torch）；
  # 嵌入模型從主機的 Hugging Face 快取唯讀掛入（.env 的 HF_CACHE_DIR），不在容器內下載。
  serve:
    build:
      context: .
      target: runtime
      args:
        EMBEDDINGS: "true"
    image: ipas-hub:serve
    profiles: [serve]
    # 啟用 serve profile 時一併啟動 db 與 vllm
    depends_on:
      db:
        condition: service_healthy
      vllm:
        condition: service_started
    environment:
      LLM_BASE_URL: http://vllm:8000/v1
      LLM_MODEL: ${LLM_SERVED_NAME:-qwen3-vl-8b-fp8}
      PG_DSN: host=db port=5432 dbname=ipas user=ipas
      PGPASSWORD: ${PG_PASSWORD:-}
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/runs:/app/data/runs
      - ${HF_CACHE_DIR:-hf-cache}:/models/huggingface:ro
    ports:
      - "127.0.0.1:${RAG_PORT:-8100}:8100"
    command:
      - serve
      - --store=pg
      - --routes=${RAG_ROUTES:-config/rag-routes.json}
      - --host=0.0.0.0
      - --port=8100
      # 引用連結給瀏覽器開，所以是主機上的位址
      - --link-base=http://127.0.0.1:${RAG_PORT:-8100}
  # 聊天介面（AnythingLLM，MIT 授權）。只在 --profile ui 啟動。
  # 把 RAG 端點（serve 容器，或主機上執行的 `ipas_hub.cli serve`）當成模型；工作區不要上傳文件，檢索與外部搜尋都由本專案負責。
  ui:
    image: mintplexlabs/anythingllm:latest@sha256:be5f75b6744e0e6697162dfd2c14b0351514f2b3f8cb1a71bbd349488383e0d2
    profiles: [ui]
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STORAGE_DIR: /app/server/storage
      DISABLE_TELEMETRY: "true"
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: http://host.docker.internal:${RAG_PORT:-8100}/v1
      GENERIC_OPEN_AI_MODEL_PREF: ${RAG_SERVED_NAME:-rag}
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: "6144"
      GENERIC_OPEN_AI_API_KEY: local
      VECTOR_DB: lancedb
    volumes:
      - ui-storage:/app/server/storage
  # PostgreSQL＋pgvector（--profile db）。存放已驗證的索引片段與向量，資料在 pg-data volume；只綁本機。
  # 密碼由 .env 的 PG_PASSWORD 提供；未設定時容器會拒絕啟動，不使用預設密碼。
  db:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    profiles: [db, serve]
    environment:
      POSTGRES_USER: ipas
      POSTGRES_DB: ipas
      POSTGRES_PASSWORD: ${PG_PASSWORD:-}
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipas -d ipas"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pg-data:
  ui-storage:
  hf-cache:
  llm-models:
    external: true
    name: ${LLM_MODEL_VOLUME:-ipas-llm-models}
